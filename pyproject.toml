[project]
name = "photocurate"
version = "0.1.0"
description = "Reproducible evaluation of VLM photo curation against human labels"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pillow>=11,<13",
    "pillow-heif>=1,<2",
    "python-dotenv>=1,<2",
]

[project.scripts]
photocurate = "photocurate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
